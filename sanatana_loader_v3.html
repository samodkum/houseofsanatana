
<style>
*{margin:0;padding:0;box-sizing:border-box}
#w{position:relative;width:100%;height:520px;overflow:hidden;background:#080604}
canvas{position:absolute;top:0;left:0;display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-family:Georgia,serif;transition:opacity 0.4s}
.om{font-size:54px;color:#d4a017;line-height:1;margin-bottom:8px;animation:glow 2.5s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 10px #d4a01730}50%{text-shadow:0 0 40px #d4a017aa,0 0 80px #d4a01730}}
.ttl{font-size:30px;letter-spacing:10px;color:#f0c040;text-transform:uppercase}
.sub{font-size:9px;letter-spacing:5px;color:#7a5c18;text-transform:uppercase;margin-top:5px}
.dvd{width:110px;height:1px;background:linear-gradient(90deg,transparent,#d4a01770,transparent);margin:18px auto}
.pills{display:flex;gap:28px}
.pl{text-align:center}
.ps{font-size:15px;color:#c8950f;display:block;margin-bottom:3px}
.pn{font-size:8px;letter-spacing:2px;color:#7a5c18;text-transform:uppercase}
#pb{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:260px;pointer-events:none;font-family:Georgia,serif;transition:opacity 0.4s}
#pt{width:100%;height:1px;background:#1e1400}
#pf{height:100%;width:0;background:#d4a017}
#pn{margin-top:9px;font-size:10px;letter-spacing:3px;color:#7a5c18;text-align:center}
#mt{position:absolute;bottom:24px;width:100%;text-align:center;font-size:8px;letter-spacing:3px;color:#4a3410;text-transform:uppercase;font-family:Georgia,serif;pointer-events:none;transition:opacity 0.4s}
#rb{position:absolute;bottom:8px;right:8px;z-index:20;padding:5px 12px;background:transparent;border:0.5px solid #3a2a0a;color:#7a5c18;font-size:10px;letter-spacing:1px;cursor:pointer;font-family:Georgia,serif}
</style>
<div id="w">
  <canvas id="cv"></canvas>
  <div id="ui">
    <span class="om">ॐ</span>
    <div class="ttl">Sanatana</div>
    <div class="sub">The Eternal Way of Life</div>
    <div class="dvd"></div>
    <div class="pills">
      <div class="pl"><span class="ps">☀</span><span class="pn">Dharma</span></div>
      <div class="pl"><span class="ps">✦</span><span class="pn">Satya</span></div>
      <div class="pl"><span class="ps">✿</span><span class="pn">Karma</span></div>
      <div class="pl"><span class="ps">☽</span><span class="pn">Seva</span></div>
    </div>
  </div>
  <div id="pb"><div id="pt"><div id="pf"></div></div><div id="pn">0%</div></div>
  <div id="mt">Dharma · Satya · Karma · Seva · Sanskriti</div>
  <button id="rb" onclick="boot()">↺ Replay</button>
</div>
<script>
(function(){
const wrap=document.getElementById('w');
const cv=document.getElementById('cv');
const cx=cv.getContext('2d');
const ui=document.getElementById('ui');
const pb=document.getElementById('pb');
const mt=document.getElementById('mt');
const pf=document.getElementById('pf');
const pn=document.getElementById('pn');

let W,H,pts=[],stars=[];
let phase='idle',pval=0,lineAlpha=0,slideT=0,rafId,ptimer;

function resize(){
  const r=wrap.getBoundingClientRect();
  W=r.width||680; H=r.height||520;
  cv.width=W; cv.height=H;
}

function buildPts(){
  pts=[];
  const n=16, cx2=W*0.5, amp=30;
  for(let i=0;i<=n;i++){
    const y=(i/n)*H;
    const x=cx2+(i%2===0?-amp:amp);
    pts.push([x,y]);
  }
}

function buildStars(){
  stars=[];
  for(let i=0;i<60;i++) stars.push({
    x:Math.random()*W, y:Math.random()*H,
    r:Math.random()*1.3+0.3,
    a:Math.random(), da:(Math.random()*0.01+0.004)*(Math.random()>.5?1:-1)
  });
}

function drawScene(offX,offY,clipFn){
  cx.save();
  cx.translate(offX,offY);
  if(clipFn){ cx.beginPath(); clipFn(); cx.clip(); }
  const g=cx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,H*.78);
  g.addColorStop(0,'#2e1800'); g.addColorStop(.5,'#150c00'); g.addColorStop(1,'#080604');
  cx.fillStyle=g; cx.fillRect(-W,-H,W*3,H*3);
  stars.forEach(s=>{
    s.a+=s.da;
    if(s.a>1){s.a=1;s.da*=-1;} if(s.a<0){s.a=0;s.da*=-1;}
    cx.save(); cx.globalAlpha=s.a*.75;
    cx.fillStyle='#d4a017'; cx.beginPath();
    cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill(); cx.restore();
  });
  cx.restore();
}

function zigPath(){
  cx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]);
}

function leftClip(){
  cx.moveTo(0,0);
  cx.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]);
  cx.lineTo(0,H); cx.closePath();
}

function rightClip(){
  cx.moveTo(W,0);
  cx.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]);
  cx.lineTo(W,H); cx.closePath();
}

function drawLine(alpha){
  cx.save();
  cx.globalAlpha=alpha;
  cx.strokeStyle='#d4a017'; cx.lineWidth=1.8;
  cx.shadowColor='#d4a017'; cx.shadowBlur=10;
  cx.beginPath(); zigPath(); cx.stroke();
  cx.restore();
}

function easeInCubic(t){return t*t*t;}

function frame(){
  cx.clearRect(0,0,W,H);

  if(phase==='loading'){
    drawScene(0,0,null);

  } else if(phase==='revealing'){
    drawScene(0,0,null);
    lineAlpha=Math.min(lineAlpha+0.03,1);
    drawLine(lineAlpha);
    if(lineAlpha>=1){ phase='sliding'; slideT=0; }

  } else if(phase==='sliding'){
    slideT=Math.min(slideT+0.014,1);
    const e=easeInCubic(slideT);
    const topOff=-e*(H+80);
    const botOff= e*(H+80);

    drawScene(0,topOff,leftClip);
    drawScene(0,botOff,rightClip);

    const la=Math.max(0,1-slideT*6);
    if(la>0) drawLine(la);

    const fa=Math.max(0,1-slideT*3);
    ui.style.opacity=fa; pb.style.opacity=fa; mt.style.opacity=fa;

    if(slideT>=1){ cx.clearRect(0,0,W,H); phase='done'; return; }

  } else if(phase==='done'){ return; }

  rafId=requestAnimationFrame(frame);
}

function tickProg(){
  if(phase!=='loading') return;
  pval+=0.9+Math.random()*0.5;
  if(pval>=100){
    pval=100; pf.style.width='100%'; pn.textContent='100%';
    setTimeout(()=>{ phase='revealing'; lineAlpha=0; },350);
    return;
  }
  pf.style.width=Math.floor(pval)+'%';
  pn.textContent=Math.floor(pval)+'%';
  ptimer=setTimeout(tickProg,36+Math.random()*18);
}

window.boot=function(){
  cancelAnimationFrame(rafId); clearTimeout(ptimer);
  pval=0; lineAlpha=0; slideT=0;
  pf.style.width='0%'; pn.textContent='0%';
  ui.style.opacity='1'; pb.style.opacity='1'; mt.style.opacity='1';
  resize(); buildPts(); buildStars();
  phase='loading';
  frame();
  setTimeout(tickProg,150);
};

window.addEventListener('resize',()=>{ resize(); buildPts(); });
boot();
})();
</script>
